version: '3.8'

services:
  newsnow-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: newsnow-ai:latest
    container_name: newsnow-ai
    ports:
      - '4444:4444'
    volumes:
      - newsnow_ai_data:/usr/app/.data:rw
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4444
      - G_CLIENT_ID=${G_CLIENT_ID}
      - G_CLIENT_SECRET=${G_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - INIT_TABLE=${INIT_TABLE:-true}
      - ENABLE_CACHE=${ENABLE_CACHE:-true}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK}
      - WECOM_WEBHOOK=${WECOM_WEBHOOK}
      - FEISHU_TEST_WEBHOOK=${FEISHU_TEST_WEBHOOK}
      - WECOM_TEST_WEBHOOK=${WECOM_TEST_WEBHOOK}
      - DIGEST_BASE_URL=${DIGEST_BASE_URL:-http://localhost:4444}
      - INTEL_MIN_SCORE=${INTEL_MIN_SCORE:-85}
      - FRESHNESS_WINDOW_MS=43200000
      - ENABLE_CACHE=${ENABLE_CACHE:-true}
    depends_on:
      ollama:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [CMD, node, -e, 'require(''http'').get(''http://localhost:4444/'', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - traefik.enable=false
      - com.century-labs.watch.restart=true

  ollama:
    image: ollama/ollama:latest
    container_name: newsnow-ai-ollama
    volumes:
      - ollama_data:/root/.ollama:rw
      - /etc/localtime:/etc/localtime:ro
    environment:
      - OLLAMA_HOST=0.0.0.0
    command: serve
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: newsnow-ai-tunnel
    restart: always
    command: tunnel --no-autoupdate run --url http://newsnow-ai:4444 newsnow-ai
    volumes:
      - ~/.cloudflared:/etc/cloudflared:ro
    depends_on:
      newsnow-ai:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - traefik.enable=false

networks:
  app-network:
    driver: bridge
    name: newsnow-ai-network

volumes:
  newsnow_ai_data:
    name: newsnow_ai_data
    driver: local
  ollama_data:
    name: ollama_data
    driver: local
