services:
  newsnow-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: newsnow-ai:latest
    container_name: newsnow-ai
    ports:
      - '4444:4444'
    volumes:
      - newsnow_ai_data:/usr/app/.data
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      - G_CLIENT_ID=${G_CLIENT_ID}
      - G_CLIENT_SECRET=${G_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - INIT_TABLE=${INIT_TABLE:-true}
      - ENABLE_CACHE=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK:-}
      - WECOM_WEBHOOK=${WECOM_WEBHOOK:-}
      - INTEL_MIN_SCORE=${INTEL_MIN_SCORE:-80}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4444/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  ollama:
    image: ollama/ollama:latest
    container_name: newsnow-ai-ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull bge-m3 && wait"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # CPU 模式资源限制
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: newsnow-ai-tunnel
    restart: always
    command: tunnel --no-autoupdate run --url http://newsnow-ai:4444 newsnow-ai
    volumes:
      - $HOME/.cloudflared:/etc/cloudflared:ro
    depends_on:
      newsnow-ai:
        condition: service_healthy

volumes:
  newsnow_ai_data:
    name: newsnow_ai_data
  ollama_data:
    name: ollama_data
